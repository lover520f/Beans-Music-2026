<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beans Music 服务器 · 搜索即播</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", sans-serif; background: #0f1117; color: #e8eaf0; min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #8a90a0; font-size: 13px; margin-bottom: 20px; }
  .search { display: flex; gap: 10px; margin-bottom: 8px; }
  input[type=text] { flex: 1; padding: 12px 14px; border-radius: 12px; border: 1px solid #2a2f3a; background: #171b24; color: #e8eaf0; font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: #4f8cff; }
  button { padding: 12px 18px; border-radius: 12px; border: none; background: #4f8cff; color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  .hint { color: #6b7280; font-size: 12px; margin-bottom: 16px; }
  .status { font-size: 13px; color: #8a90a0; margin: 10px 0; min-height: 18px; }
  .song { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: #171b24; margin-bottom: 8px; cursor: pointer; border: 1px solid #232836; transition: background .15s; }
  .song:hover { background: #1e2430; }
  .song.playing { border-color: #4f8cff; background: #1c2330; }
  .song img { width: 46px; height: 46px; border-radius: 8px; object-fit: cover; background: #262b36; }
  .song .info { flex: 1; min-width: 0; }
  .song .name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song .meta { font-size: 12px; color: #8a90a0; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 10px; padding: 2px 7px; border-radius: 6px; background: #232836; color: #b8c0d0; }
  .badge.qq { color:#3ea6ff; } .badge.netease { color:#ff5b5b; } .badge.kugou { color:#2dd4bf; } .badge.migu { color:#a78bfa; }
  audio { width: 100%; margin-top: 14px; }
  .now { font-size: 13px; color: #c3c9d6; margin-top: 12px; }
  .err { color: #ff7b7b; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎵 Beans Music 服务器</h1>
  <div class="sub">基于 musicdl · 搜索即播（服务器直连多平台音源，无需登录）</div>
  <div class="search">
    <input id="kw" type="text" placeholder="输入歌名 / 歌手，如：晴天 周杰伦" value="">
    <button id="btn">搜索</button>
  </div>
  <div class="hint">默认音源：QQ音乐 / 网易云 / 酷狗 / 咪咕。首次搜索较慢（约 1~2 分钟），之后有缓存秒出。</div>
  <div id="status" class="status"></div>
  <div id="list"></div>
  <audio id="audio" controls></audio>
  <div id="now" class="now"></div>
</div>
<script>
  const $ = s => document.querySelector(s);
  const kw = $('#kw'), btn = $('#btn'), statusEl = $('#status'), listEl = $('#list'), audio = $('#audio'), nowEl = $('#now');
  let songs = [];

  async function doSearch() {
    const keyword = kw.value.trim();
    if (!keyword) return;
    btn.disabled = true;
    listEl.innerHTML = '';
    nowEl.textContent = '';
    audio.pause(); audio.removeAttribute('src');
    statusEl.textContent = '搜索中…（QQ/酷狗解析较慢，请耐心等待，结果会自动出现）';
    const t0 = Date.now();
    try {
      const r = await fetch('/api/search?keyword=' + encodeURIComponent(keyword) + '&limit=8');
      const j = await r.json();
      if (!r.ok || j.code !== 0) throw new Error(j.detail || ('HTTP ' + r.status));
      songs = j.songs || [];
      statusEl.textContent = '共 ' + songs.length + ' 首（耗时 ' + Math.round((Date.now()-t0)/1000) + 's）';
      render(songs);
    } catch (e) {
      statusEl.innerHTML = '<span class="err">搜索失败：' + e.message + '</span>';
    } finally {
      btn.disabled = false;
    }
  }

  function render(list) {
    listEl.innerHTML = '';
    list.forEach((s, i) => {
      const row = document.createElement('div');
      row.className = 'song';
      const img = s.cover ? '<img src="' + s.cover + '" onerror="this.style.visibility=\'hidden\'">' : '<img src="">';
      const badge = '<span class="badge ' + s.source + '">' + ({qq:'QQ',netease:'网易云',kugou:'酷狗',migu:'咪咕',kuwo:'酷我',qianqian:'千千',soda:'汽水'}[s.source] || s.source) + '</span>';
      row.innerHTML = img + '<div class="info"><div class="name">' + esc(s.name) + '</div><div class="meta">' + esc(s.artists || '未知歌手') + ' · ' + esc(s.album || '') + ' · ' + (s.duration ? fmt(s.duration) : '') + '</div></div>' + badge;
      row.onclick = () => play(i);
      listEl.appendChild(row);
    });
  }

  function play(i) {
    const s = songs[i];
    if (!s) return;
    audio.src = s.stream || s.url;
    audio.play();
    nowEl.textContent = '▶ ' + s.name + ' — ' + (s.artists || '');
    document.querySelectorAll('.song').forEach((el, k) => el.classList.toggle('playing', k === i));
  }

  const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = sec => { sec = Math.max(0, Math.round(sec)); return Math.floor(sec/60) + ':' + String(sec%60).padStart(2,'0'); };
  btn.onclick = doSearch;
  kw.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
</body>
</html>
