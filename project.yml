name: Beans

options:
  deploymentTarget:
    iOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Beans:
    type: application
    platform: iOS
    sources: [Beans]
    dependencies:
      - target: BeansWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beans.app
        MARKETING_VERSION: "1.6.5"  # 版本规则见 VERSIONING.md：修 bug +0.0.1，加功能 +0.1
        CURRENT_PROJECT_VERSION: "53"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: Beans/Beans-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Beans/Info.plist
      properties:
        CFBundleDisplayName: Beans Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIImageName: LaunchBackground
          UIColorName: LaunchBackgroundColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true

  BeansWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BeansWidget
      - path: Beans/NowPlayingActivity.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beans.app.widget
        MARKETING_VERSION: "1.6.5"
        CURRENT_PROJECT_VERSION: "53"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beans Music

schemes:
  Beans:
    build:
      targets:
        Beans: all
        BeansWidget: all
    run:
      config: Debug
    archive:
      config: Release
