name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Bump version (每次构建版本号+1)
        id: bump
        run: |
          python3 - <<'PYEOF'
          import re
          path = 'project.yml'
          with open(path) as f:
              content = f.read()

          def bump_version(m):
              # 三段式版本号：1.9 -> 1.9.1 -> 1.9.2 ...（避免出现 1.10 这类歧义版本号）
              parts = m.group(1).split('.')
              if parts == ['1', '0']:
                  # 对外发布版本 1.0：保持 1.0 不变，仅构建号 +1
                  return 'MARKETING_VERSION: "1.0"'
              if len(parts) < 3:
                  parts.append('1')
              else:
                  parts[-1] = str(int(parts[-1]) + 1)
              return 'MARKETING_VERSION: "' + '.'.join(parts) + '"'

          def bump_build(m):
              return 'CURRENT_PROJECT_VERSION: "' + str(int(m.group(1)) + 1) + '"'

          content, n1 = re.subn(r'MARKETING_VERSION:\s*"([^"]+)"', bump_version, content, count=1)
          content, n2 = re.subn(r'CURRENT_PROJECT_VERSION:\s*"(\d+)"', bump_build, content, count=1)
          with open(path, 'w') as f:
              f.write(content)
          ver = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', content).group(1)
          build = re.search(r'CURRENT_PROJECT_VERSION:\s*"(\d+)"', content).group(1)
          print('::notice title=Version::Bumped to %s (%s)' % (ver, build))
          with open('version.txt', 'w') as f:
              f.write('%s (%s)' % (ver, build))
          PYEOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          VER=$(grep -oE 'MARKETING_VERSION: "[^"]+"' project.yml | sed -E 's/.*"([^"]+)"/\1/')
          BUILD=$(grep -oE 'CURRENT_PROJECT_VERSION: "[0-9]+"' project.yml | sed -E 's/.*"([0-9]+)"/\1/')
          echo "Building with MARKETING_VERSION=$VER CURRENT_PROJECT_VERSION=$BUILD"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "VERSION_LABEL=$VER ($BUILD)" >> "$GITHUB_ENV"
          xcodebuild \
            -project Beans.xcodeproj \
            -scheme Beans \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="$VER" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify version in built app
        run: |
          echo "== project.yml =="
          grep -E "MARKETING_VERSION|CURRENT_PROJECT_VERSION" project.yml
          echo "== built Info.plist =="
          plutil -p build/Build/Products/Release-iphoneos/Beans.app/Info.plist | grep -E "CFBundleShortVersionString|CFBundleVersion"

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Beans.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Beans-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Beans-unsigned-ipa
          path: Beans-unsigned.ipa

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          name: Beans Music ${{ env.VERSION_LABEL }}
          body: |
            ## Beans Music ${{ env.VERSION_LABEL }}

            自动构建的未签名 IPA（Unsigned），需自签安装。

            ### 安装说明
            - 要求 iOS 26+（依赖原生液态玻璃）
            - 未签名 IPA 请使用 Sideloadly / AltStore / 爱思助手 用 Apple ID 自行签名安装（免费自签 7 天有效）
            - Bundle ID：com.beans.app

            ### 免责声明
            本应用仅供个人学习研究使用，禁止用于商业及非法用途。
            音乐 API 来自 GitHub 开源的非官方接口实现，本软件不提供任何音频存储服务。
            音乐版权归各平台所有，请支持正版。
          files: Beans-unsigned.ipa

      - name: Commit version bump back
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml
          if git diff --cached --quiet; then
            echo "no version change to commit"
          else
            git commit -m "chore: bump version to $(cat version.txt) [skip ci]"
            git push
          fi